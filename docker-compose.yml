services:
  # ------------------------------------------------------------------
  # PostgreSQL database
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mediverse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediverse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediverse_password}
      POSTGRES_DB: ${POSTGRES_DB:-mediverse_db}
    ports:
      - "5432:5432"
    volumes:
      - mediverse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediverse_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediverse_network

  # ------------------------------------------------------------------
  # FastAPI backend
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediverse_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - mediverse_network

  # ------------------------------------------------------------------
  # React frontend
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediverse_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mediverse_network

networks:
  mediverse_network:
    driver: bridge

volumes:
  mediverse_db_data:
    driver: local
